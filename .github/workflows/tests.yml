name: GitHub CI

on:
  push:
    branches: [ master, fmm-galerkin ]
  pull_request:
    branches: [ master, fmm-galerkin ]
  workflow_dispatch:

jobs:
  debug-and-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The packages come from Launchpad and the Ubuntu archive, whose
    # transient failures (a stalled download, a mirror in sync) failed the
    # job before: retry the build, which keeps the layers that passed.
    - name: Build deal.II 9.8.0 CI environment
      timeout-minutes: 60
      run: |
        set -o pipefail
        for attempt in 1 2 3; do
          if docker build --progress=plain -f docker/Dockerfile.ci \
               -t pi-bem-ci:9.8.0 . 2>&1 | tee docker.log; then
            exit 0
          fi
          echo "::warning title=Docker build::attempt $attempt failed"
          sleep 60
        done
        exit 1
    - name: Test Debug and Release without compiler warnings
      run: |
        set -o pipefail
        docker run --rm \
          -e OMPI_ALLOW_RUN_AS_ROOT=1 -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
          -v "$PWD:/workspace" -w /workspace pi-bem-ci:9.8.0 bash -lc '
            set -e
            cmake -S . -B build-docker/9.8.0-ci -GNinja \
              -DCMAKE_BUILD_TYPE=DebugRelease -DCMAKE_CXX_FLAGS=-Werror \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold \
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=mold
            cmake --build build-docker/9.8.0-ci -j 2 -- -k 0
            test -x build-docker/9.8.0-ci/bem_fma_3d
            test -x build-docker/9.8.0-ci/bem_fma_3d.g
            cd build-docker/9.8.0-ci
            ctest -j 2 --output-on-failure
          ' 2>&1 | tee ci.log
    # Only members of the repository can read the log of a job; annotations
    # are public, and show next to the changes of a pull request.
    - name: Report the first compiler error and the failed tests
      if: failure()
      run: |
        annotate() {
          echo "::error title=$1::$(sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
        }
        if [ ! -f ci.log ]; then
          if [ -f docker.log ]; then
            tail -60 docker.log | annotate "End of the docker build"
          fi
          exit 0
        fi
        first=$(grep -n -m 1 -E 'error:|warning:|CMake Error' ci.log | cut -d: -f1)
        if [ -n "$first" ]; then
          start=$(( first > 15 ? first - 15 : 1 ))
          sed -n "${start},$(( first + 45 ))p" ci.log | annotate "First compiler error"
          grep -E 'error:|warning:' ci.log | sed 's|/workspace/||' | sort -u | head -60 |
            annotate "All compiler errors"
        fi
        if grep -q 'The following tests FAILED' ci.log; then
          sed -n '/The following tests FAILED/,$p' ci.log | head -40 | annotate "Failed tests"
          grep -A 25 -E 'DIFF failed|RUN failed' ci.log | head -150 | annotate "Test output"
        fi
        if [ -z "$first" ] && ! grep -q 'The following tests FAILED' ci.log; then
          tail -60 ci.log | annotate "End of the log"
        fi
